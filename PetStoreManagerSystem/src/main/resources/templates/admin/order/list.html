<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>订单管理 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}" th:with="activePage='order'"></div>
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar('订单管理')}"></div>
    <div class="main-content">

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/index}">仪表盘</a></li>
          <li class="breadcrumb-item active">订单管理</li>
        </ol>
      </nav>

      <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <span><i class="bi bi-receipt me-2 text-primary"></i>订单列表</span>
            <!-- 状态筛选 -->
            <form th:action="@{/admin/order/list}" method="get" class="d-flex gap-2">
              <select class="form-select form-select-sm" name="status" style="width:130px">
                <option value="">全部状态</option>
                <option value="P" th:selected="${param.status == 'P'}">待处理</option>
                <option value="S" th:selected="${param.status == 'S'}">已发货</option>
                <option value="F" th:selected="${param.status == 'F'}">已完成</option>
                <option value="C" th:selected="${param.status == 'C'}">已取消</option>
              </select>
              <input type="text" class="form-control form-control-sm" name="keyword"
                     th:value="${param.keyword}" placeholder="用户名/订单号" style="width:150px"/>
              <button type="submit" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-search"></i>
              </button>
            </form>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
              <tr>
                <th>订单ID</th>
                <th>用户名</th>
                <th>下单时间</th>
                <th>收件人</th>
                <th>物流商</th>
                <th>总金额</th>
                <th>状态</th>
                <th style="width:180px">操作</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${orders == null or #lists.isEmpty(orders)}">
                <td colspan="8" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-2 d-block mb-2"></i>暂无订单数据
                </td>
              </tr>
              <tr th:each="order : ${orders}">
                <td><span class="fw-semibold" th:text="'#' + order.orderId">#001</span></td>
                <td th:text="${order.username}">username</td>
                <td th:text="${#dates.format(order.orderDate,'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                <td th:text="${order.shipToFirstName + ' ' + order.shipToLastName}">John Doe</td>
                <td th:text="${order.courier}">UPS</td>
                <td th:text="${'$' + #numbers.formatDecimal(order.totalPrice,1,2)}">$0.00</td>
                <td>
                  <span class="badge"
                        th:classappend="${order.status == 'P'} ? 'bg-warning text-dark' :
                                         (${order.status == 'S'} ? 'bg-primary' :
                                         (${order.status == 'F'} ? 'bg-success' : 'bg-secondary'))"
                        th:text="${order.status == 'P'} ? '待处理' :
                                  (${order.status == 'S'} ? '已发货' :
                                  (${order.status == 'F'} ? '已完成' : '已取消'))">
                    待处理
                  </span>
                </td>
                <td>
                  <a th:href="@{/admin/order/detail/{id}(id=${order.orderId})}"
                     class="btn btn-sm btn-outline-primary me-1">
                    <i class="bi bi-eye"></i> 详情
                  </a>
                  <button type="button" class="btn btn-sm btn-outline-danger"
                          th:data-id="${order.orderId}"
                          onclick="confirmDelete(this)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h6 class="modal-title fw-bold text-danger"><i class="bi bi-exclamation-triangle me-2"></i>确认删除</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-0">
        <p class="mb-0">确定要删除订单 <strong id="deleteOrderId"></strong> 吗？此操作不可恢复。</p>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">取消</button>
        <form id="deleteForm" method="post">
          <button type="submit" class="btn btn-sm btn-danger">确认删除</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  const ctx = /*[[@{/admin/order/delete/}]]*/ '/admin/order/delete/';
  function confirmDelete(btn) {
    document.getElementById('deleteOrderId').textContent = '#' + btn.dataset.id;
    document.getElementById('deleteForm').action = ctx + btn.dataset.id;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
  }
  document.getElementById('sidebarToggle')?.addEventListener('click', () =>
    document.getElementById('wrapper').classList.toggle('toggled'));
</script>
</body>
</html>
