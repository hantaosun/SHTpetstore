<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>仪表盘 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">

  <!-- Sidebar -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

  <!-- Page Content -->
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar('仪表盘')}"></div>

    <div class="main-content">
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item active">仪表盘</li>
        </ol>
      </nav>

      <!-- Flash Message -->
      <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${dashboardError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${dashboardError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Stat Cards -->
      <div class="row g-3 mb-4">
        <div class="col-xl-3 col-md-6">
          <div class="stat-card" style="background: linear-gradient(135deg,#2563eb,#3b82f6);">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="stat-label">商品分类</div>
                <div class="stat-value" th:text="${totalCategories != null ? totalCategories : 0}">0</div>
              </div>
              <i class="bi bi-tags stat-icon"></i>
            </div>
            <a th:href="@{/admin/category/list}" class="text-white text-decoration-none small">
              查看详情 <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="stat-card" style="background: linear-gradient(135deg,#059669,#10b981);">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="stat-label">商品数量</div>
                <div class="stat-value" th:text="${totalProducts != null ? totalProducts : 0}">0</div>
              </div>
              <i class="bi bi-box-seam stat-icon"></i>
            </div>
            <a th:href="@{/admin/product/list}" class="text-white text-decoration-none small">
              查看详情 <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="stat-card" style="background: linear-gradient(135deg,#7c3aed,#8b5cf6);">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="stat-label">注册用户</div>
                <div class="stat-value" th:text="${totalUsers != null ? totalUsers : 0}">0</div>
              </div>
              <i class="bi bi-people stat-icon"></i>
            </div>
            <a th:href="@{/admin/user/list}" class="text-white text-decoration-none small">
              查看详情 <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="stat-card" style="background: linear-gradient(135deg,#dc2626,#ef4444);">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <div class="stat-label">订单总数</div>
                <div class="stat-value" th:text="${totalOrders != null ? totalOrders : 0}">0</div>
              </div>
              <i class="bi bi-receipt stat-icon"></i>
            </div>
            <a th:href="@{/admin/order/list}" class="text-white text-decoration-none small">
              查看详情 <i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>

      <!-- Recent Orders -->
      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <span><i class="bi bi-clock-history me-2 text-primary"></i>最近订单</span>
          <a th:href="@{/admin/order/list}" class="btn btn-sm btn-outline-primary">查看全部</a>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
              <tr>
                <th>订单ID</th>
                <th>用户名</th>
                <th>下单时间</th>
                <th>总金额</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${recentOrders == null or #lists.isEmpty(recentOrders)}">
                <td colspan="6" class="text-center text-muted py-4">暂无订单数据</td>
              </tr>
              <tr th:each="order : ${recentOrders}">
                <td><span class="fw-semibold" th:text="'#' + order.orderId">#001</span></td>
                <td th:text="${order.username}">username</td>
                <td th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm') : '-'}">2024-01-01</td>
                <td th:text="${order.totalPrice != null ? '$' + #numbers.formatDecimal(order.totalPrice,1,2) : '-'}">$0.00</td>
                <td>
                  <span class="badge"
                        th:classappend="${order.status == 'P'} ? 'bg-warning text-dark' : (${order.status == 'S'} ? 'bg-success' : 'bg-secondary')"
                        th:text="${order.status == 'P'} ? '待处理' : (${order.status == 'S'} ? '已发货' : order.status)">
                    待处理
                  </span>
                </td>
                <td>
                  <a th:href="@{/admin/order/detail/{id}(id=${order.orderId})}"
                     class="btn btn-sm btn-outline-primary">详情</a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div><!-- /main-content -->
  </div><!-- /page-content-wrapper -->
</div><!-- /wrapper -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('sidebarToggle')?.addEventListener('click', () => {
    document.getElementById('wrapper').classList.toggle('toggled');
  });
</script>
</body>
</html>
