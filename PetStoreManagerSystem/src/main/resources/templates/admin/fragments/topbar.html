<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar(pageTitle)" class="topbar d-flex align-items-center px-4">
  <button class="btn btn-link text-white me-3 p-0 fs-5" id="sidebarToggle">
    <i class="bi bi-list"></i>
  </button>
  <h5 class="mb-0 fw-semibold" th:text="${pageTitle}">页面标题</h5>
  <div class="ms-auto d-flex align-items-center gap-3">
    <span class="text-white-50 small">
      <i class="bi bi-person-circle me-1"></i>
      <span th:text="${(adminUserDisplay != null && !adminUserDisplay.isEmpty()) ? adminUserDisplay : 'Admin'}">Admin</span>
    </span>
    <a th:href="@{/admin/logout}" class="btn btn-sm btn-outline-light">
      <i class="bi bi-box-arrow-right me-1"></i>退出
    </a>
  </div>
</header>
</body>
</html>
