<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>管理员登录 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card card p-5">
    <div class="text-center mb-4">
      <i class="bi bi-shop-window fs-1 text-primary"></i>
      <h4 class="mt-2 fw-bold">PetStore 管理后台</h4>
      <p class="text-muted small">请使用管理员账号登录</p>
    </div>

    <!-- 错误提示 -->
    <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2" role="alert">
      <i class="bi bi-exclamation-circle me-2"></i>
      <span th:text="${error}">用户名或密码错误</span>
    </div>
    <!-- 登出提示 -->
    <div th:if="${message}" class="alert alert-success d-flex align-items-center py-2" role="alert">
      <i class="bi bi-check-circle me-2"></i>
      <span th:text="${message}">操作成功</span>
    </div>

    <form th:action="@{/admin/login}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label">用户名</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username"
                 placeholder="请输入管理员账号" required autofocus/>
        </div>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">密码</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="请输入密码" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>登 录
      </button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
