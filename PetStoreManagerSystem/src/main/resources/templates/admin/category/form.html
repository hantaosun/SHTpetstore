<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${isEdit} ? '编辑分类' : '新增分类'">分类表单 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar(${isEdit} ? '编辑分类' : '新增分类')}"></div>
    <div class="main-content">

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/index}">仪表盘</a></li>
          <li class="breadcrumb-item"><a th:href="@{/admin/category/list}">分类管理</a></li>
          <li class="breadcrumb-item active" th:text="${isEdit} ? '编辑分类' : '新增分类'">新增分类</li>
        </ol>
      </nav>

      <div class="row">
        <div class="col-lg-6">
          <div class="card">
            <div class="card-header">
              <i class="bi bi-tag me-2 text-primary"></i>
              <span th:text="${isEdit} ? '编辑分类信息' : '填写分类信息'">分类信息</span>
            </div>
            <div class="card-body">
              <form th:action="${isEdit} ? @{/admin/category/update} : @{/admin/category/save}"
                    method="post" novalidate>
                <!-- 编辑时隐藏传ID -->
                <input th:if="${isEdit}" type="hidden" name="categoryId"
                       th:value="${category.categoryId}"/>

                <div class="mb-3">
                  <label for="categoryId" class="form-label">分类ID <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="categoryId" name="categoryId"
                         th:value="${category?.categoryId}"
                         th:readonly="${isEdit}"
                         placeholder="如：FISH、DOGS、CATS"
                         required/>
                  <div class="form-text" th:if="${!isEdit}">全大写英文，新增后不可修改</div>
                </div>

                <div class="mb-3">
                  <label for="name" class="form-label">分类名称 <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="name" name="name"
                         th:value="${category?.name}"
                         placeholder="请输入分类名称" required/>
                </div>

                <div class="mb-4">
                  <label for="description" class="form-label">分类描述</label>
                  <textarea class="form-control" id="description" name="description" rows="3"
                            placeholder="请输入分类描述（可选）"
                            th:text="${category?.description}"></textarea>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>
                    <span th:text="${isEdit} ? '保存修改' : '新增分类'">提交</span>
                  </button>
                  <a th:href="@{/admin/category/list}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg me-1"></i>取消
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('sidebarToggle')?.addEventListener('click', () => {
    document.getElementById('wrapper').classList.toggle('toggled');
  });
</script>
</body>
</html>
