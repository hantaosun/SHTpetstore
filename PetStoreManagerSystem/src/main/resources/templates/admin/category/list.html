<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>分类管理 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar('分类管理')}"></div>
    <div class="main-content">

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/index}">仪表盘</a></li>
          <li class="breadcrumb-item active">分类管理</li>
        </ol>
      </nav>

      <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <span><i class="bi bi-tags me-2 text-primary"></i>商品分类列表</span>
          <a th:href="@{/admin/category/add}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>新增分类
          </a>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
              <tr>
                <th>分类ID</th>
                <th>分类名称</th>
                <th>描述</th>
                <th style="width:160px">操作</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${categories == null or #lists.isEmpty(categories)}">
                <td colspan="4" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-2 d-block mb-2"></i>暂无分类数据
                </td>
              </tr>
              <tr th:each="cat : ${categories}">
                <td><code th:text="${cat.categoryId}">FISH</code></td>
                <td class="fw-semibold" th:text="${cat.name}">Fish</td>
                <td class="text-muted" th:text="${cat.description}">-</td>
                <td>
                  <a th:href="@{/admin/category/edit/{id}(id=${cat.categoryId})}"
                     class="btn btn-sm btn-outline-primary me-1">
                    <i class="bi bi-pencil"></i> 编辑
                  </a>
                  <button type="button" class="btn btn-sm btn-outline-danger"
                          th:data-id="${cat.categoryId}"
                          th:data-name="${cat.name}"
                          onclick="confirmDelete(this)">
                    <i class="bi bi-trash"></i> 删除
                  </button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h6 class="modal-title fw-bold text-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>确认删除
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-0">
        <p class="mb-0">确定要删除分类 <strong id="deleteName"></strong> 吗？此操作不可恢复。</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">取消</button>
        <form id="deleteForm" method="post">
          <button type="submit" class="btn btn-sm btn-danger">确认删除</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  const ctx = /*[[@{/admin/category/delete/}]]*/ '/admin/category/delete/';
  function confirmDelete(btn) {
    document.getElementById('deleteName').textContent = btn.dataset.name;
    document.getElementById('deleteForm').action = ctx + btn.dataset.id;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
  }
  document.getElementById('sidebarToggle')?.addEventListener('click', () => {
    document.getElementById('wrapper').classList.toggle('toggled');
  });
</script>
</body>
</html>
