<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${isEdit} ? '编辑SKU' : '新增SKU'">SKU表单 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar(${isEdit} ? '编辑 SKU' : '新增 SKU')}"></div>
    <div class="main-content">

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/index}">仪表盘</a></li>
          <li class="breadcrumb-item"><a th:href="@{/admin/item/list}">SKU 管理</a></li>
          <li class="breadcrumb-item active" th:text="${isEdit} ? '编辑 SKU' : '新增 SKU'">新增 SKU</li>
        </ol>
      </nav>

      <div class="row">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header">
              <i class="bi bi-upc-scan me-2 text-primary"></i>
              <span th:text="${isEdit} ? '编辑 SKU 信息' : '填写 SKU 信息'">SKU 信息</span>
            </div>
            <div class="card-body">
              <form th:action="${isEdit} ? @{/admin/item/update} : @{/admin/item/save}"
                    method="post" novalidate>
                <input th:if="${isEdit}" type="hidden" name="itemId" th:value="${item.itemId}"/>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label for="itemId" class="form-label">SKU ID <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="itemId" name="itemId"
                           th:value="${item?.itemId}"
                           th:readonly="${isEdit}"
                           placeholder="如：EST-1" required/>
                  </div>
                  <div class="col-md-6">
                    <label for="productId" class="form-label">所属商品 <span class="text-danger">*</span></label>
                    <select class="form-select" id="productId" name="productId" required>
                      <option value="">请选择商品</option>
                      <option th:each="p : ${products}"
                              th:value="${p.productId}"
                              th:text="${p.name}"
                              th:selected="${item?.product?.productId == p.productId}">Product</option>
                    </select>
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-4">
                    <label for="listPrice" class="form-label">售价 <span class="text-danger">*</span></label>
                    <div class="input-group">
                      <span class="input-group-text">$</span>
                      <input type="number" step="0.01" min="0" class="form-control" id="listPrice"
                             name="listPrice" th:value="${item?.listPrice}" placeholder="0.00" required/>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <label for="unitCost" class="form-label">成本价</label>
                    <div class="input-group">
                      <span class="input-group-text">$</span>
                      <input type="number" step="0.01" min="0" class="form-control" id="unitCost"
                             name="unitCost" th:value="${item?.unitCost}" placeholder="0.00"/>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <label for="quantity" class="form-label">库存数量 <span class="text-danger">*</span></label>
                    <input type="number" min="0" class="form-control" id="quantity" name="quantity"
                           th:value="${item?.quantity}" placeholder="0" required/>
                  </div>
                </div>

                <hr class="my-3"/>
                <p class="text-muted small mb-2">规格属性（最多5个，可选填）</p>
                <div class="row g-3 mb-4">
                  <div class="col-md-4">
                    <label class="form-label">属性1</label>
                    <input type="text" class="form-control" name="attribute1"
                           th:value="${item?.attribute1}" placeholder="如：Large"/>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">属性2</label>
                    <input type="text" class="form-control" name="attribute2"
                           th:value="${item?.attribute2}" placeholder="如：Male"/>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">属性3</label>
                    <input type="text" class="form-control" name="attribute3"
                           th:value="${item?.attribute3}" placeholder="可选"/>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">属性4</label>
                    <input type="text" class="form-control" name="attribute4"
                           th:value="${item?.attribute4}" placeholder="可选"/>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">属性5</label>
                    <input type="text" class="form-control" name="attribute5"
                           th:value="${item?.attribute5}" placeholder="可选"/>
                  </div>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>
                    <span th:text="${isEdit} ? '保存修改' : '新增 SKU'">提交</span>
                  </button>
                  <a th:href="@{/admin/item/list}" class="btn btn-outline-secondary">
                    <i class="bi bi-x-lg me-1"></i>取消
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('sidebarToggle')?.addEventListener('click', () =>
    document.getElementById('wrapper').classList.toggle('toggled'));
</script>
</body>
</html>
