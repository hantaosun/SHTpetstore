<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>SKU管理 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar('SKU 管理')}"></div>
    <div class="main-content">

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/index}">仪表盘</a></li>
          <li class="breadcrumb-item active">SKU 管理</li>
        </ol>
      </nav>

      <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <span><i class="bi bi-upc-scan me-2 text-primary"></i>商品 SKU 列表</span>
            <div class="d-flex gap-2">
              <form th:action="@{/admin/item/list}" method="get" class="d-flex gap-2">
                <select class="form-select form-select-sm" name="productId" style="width:160px">
                  <option value="">全部商品</option>
                  <option th:each="p : ${products}"
                          th:value="${p.productId}"
                          th:text="${p.name}"
                          th:selected="${param.productId == p.productId}">Product</option>
                </select>
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                  <i class="bi bi-funnel"></i> 筛选
                </button>
              </form>
              <a th:href="@{/admin/item/add}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>新增 SKU
              </a>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
              <tr>
                <th>SKU ID</th>
                <th>所属商品</th>
                <th>规格属性</th>
                <th>单价</th>
                <th>库存</th>
                <th>状态</th>
                <th style="width:180px">操作</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${items == null or #lists.isEmpty(items)}">
                <td colspan="7" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-2 d-block mb-2"></i>暂无 SKU 数据
                </td>
              </tr>
              <tr th:each="item : ${items}">
                <td><code th:text="${item.itemId}">EST-1</code></td>
                <td th:text="${item.product?.name}">Product</td>
                <td class="text-muted small">
                  <span th:text="${item.attribute1}"></span>
                  <span th:if="${item.attribute2}" th:text="' / ' + item.attribute2"></span>
                  <span th:if="${item.attribute3}" th:text="' / ' + item.attribute3"></span>
                </td>
                <td th:text="${'$' + #numbers.formatDecimal(item.listPrice,1,2)}">$0.00</td>
                <td>
                  <span th:classappend="${item.quantity <= 0} ? 'text-danger fw-bold' : 'text-success'"
                        th:text="${item.quantity}">0</span>
                </td>
                <td>
                  <span th:if="${item.quantity > 0}" class="badge bg-success">上架</span>
                  <span th:if="${item.quantity <= 0}" class="badge bg-secondary">缺货</span>
                </td>
                <td>
                  <a th:href="@{/admin/item/edit/{id}(id=${item.itemId})}"
                     class="btn btn-sm btn-outline-primary me-1">
                    <i class="bi bi-pencil"></i> 编辑
                  </a>
                  <button type="button" class="btn btn-sm btn-outline-danger"
                          th:data-id="${item.itemId}"
                          th:data-name="${item.itemId}"
                          onclick="confirmDelete(this)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h6 class="modal-title fw-bold text-danger"><i class="bi bi-exclamation-triangle me-2"></i>确认删除</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-0">
        <p class="mb-0">确定要删除 SKU <strong id="deleteName"></strong> 吗？</p>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">取消</button>
        <form id="deleteForm" method="post">
          <button type="submit" class="btn btn-sm btn-danger">确认删除</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  const ctx = /*[[@{/admin/item/delete/}]]*/ '/admin/item/delete/';
  function confirmDelete(btn) {
    document.getElementById('deleteName').textContent = btn.dataset.name;
    document.getElementById('deleteForm').action = ctx + btn.dataset.id;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
  }
  document.getElementById('sidebarToggle')?.addEventListener('click', () =>
    document.getElementById('wrapper').classList.toggle('toggled'));
</script>
</body>
</html>
