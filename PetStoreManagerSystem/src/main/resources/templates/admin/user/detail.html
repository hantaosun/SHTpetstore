<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>用户详情 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar('用户详情')}"></div>
    <div class="main-content">

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/index}">仪表盘</a></li>
          <li class="breadcrumb-item"><a th:href="@{/admin/user/list}">用户管理</a></li>
          <li class="breadcrumb-item active" th:text="${user?.username}">用户详情</li>
        </ol>
      </nav>

      <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="row g-3">
        <!-- 用户信息编辑 -->
        <div class="col-lg-7">
          <div class="card">
            <div class="card-header">
              <i class="bi bi-person me-2 text-primary"></i>用户基本信息
            </div>
            <div class="card-body">
              <form th:action="@{/admin/user/update}" method="post" novalidate>
                <input type="hidden" name="username" th:value="${user?.username}"/>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" th:value="${user?.username}" readonly/>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">状态</label>
                    <select class="form-select" name="status">
                      <option value="OK" th:selected="${user?.status == 'OK' or user?.status == null}">正常</option>
                      <option value="BLOCKED" th:selected="${user?.status == 'BLOCKED'}">封禁</option>
                    </select>
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label">名字</label>
                    <input type="text" class="form-control" name="firstName"
                           th:value="${user?.firstName}" placeholder="First Name"/>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">姓氏</label>
                    <input type="text" class="form-control" name="lastName"
                           th:value="${user?.lastName}" placeholder="Last Name"/>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">邮箱</label>
                  <input type="email" class="form-control" name="email"
                         th:value="${user?.email}" placeholder="email@example.com"/>
                </div>

                <div class="mb-3">
                  <label class="form-label">手机号</label>
                  <input type="text" class="form-control" name="phone"
                         th:value="${user?.phone}"/>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-8">
                    <label class="form-label">地址1</label>
                    <input type="text" class="form-control" name="address1"
                           th:value="${user?.address1}"/>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">地址2</label>
                    <input type="text" class="form-control" name="address2"
                           th:value="${user?.address2}"/>
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-4">
                    <label class="form-label">城市</label>
                    <input type="text" class="form-control" name="city" th:value="${user?.city}"/>
                  </div>
                  <div class="col-md-2">
                    <label class="form-label">州/省</label>
                    <input type="text" class="form-control" name="state" th:value="${user?.state}"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">邮编</label>
                    <input type="text" class="form-control" name="zip" th:value="${user?.zip}"/>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">国家</label>
                    <input type="text" class="form-control" name="country" th:value="${user?.country}"/>
                  </div>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>保存修改
                  </button>
                  <a th:href="@{/admin/user/list}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回列表
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- 侧边：偏好 + 重置密码 -->
        <div class="col-lg-5">
          <div class="card mb-3">
            <div class="card-header"><i class="bi bi-heart me-2 text-primary"></i>偏好设置</div>
            <div class="card-body">
              <dl class="row mb-0 small">
                <dt class="col-sm-5">偏好分类</dt>
                <dd class="col-sm-7">
                  <span class="badge bg-info text-dark"
                        th:text="${user?.favouriteCategoryId ?: '未设置'}">-</span>
                </dd>
                <dt class="col-sm-5">语言偏好</dt>
                <dd class="col-sm-7" th:text="${user?.languagePreference ?: '未设置'}">english</dd>
                <dt class="col-sm-5">启用 MyList</dt>
                <dd class="col-sm-7">
                  <span th:if="${user?.listOption}" class="badge bg-success">是</span>
                  <span th:if="${!user?.listOption}" class="badge bg-secondary">否</span>
                </dd>
                <dt class="col-sm-5">启用 Banner</dt>
                <dd class="col-sm-7">
                  <span th:if="${user?.bannerOption}" class="badge bg-success">是</span>
                  <span th:if="${!user?.bannerOption}" class="badge bg-secondary">否</span>
                </dd>
              </dl>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><i class="bi bi-key me-2 text-warning"></i>重置密码</div>
            <div class="card-body">
              <form th:action="@{/admin/user/resetPassword/{id}(id=${user?.username})}"
                    method="post">
                <div class="mb-3">
                  <label class="form-label">新密码</label>
                  <input type="password" class="form-control" name="newPassword"
                         placeholder="请输入新密码" required minlength="4"/>
                </div>
                <div class="mb-3">
                  <label class="form-label">确认密码</label>
                  <input type="password" class="form-control" name="confirmPassword"
                         placeholder="请再次输入新密码" required minlength="4"/>
                </div>
                <button type="submit" class="btn btn-warning w-100">
                  <i class="bi bi-key me-1"></i>重置密码
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('sidebarToggle')?.addEventListener('click', () =>
    document.getElementById('wrapper').classList.toggle('toggled'));
</script>
</body>
</html>
