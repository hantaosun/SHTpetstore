<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>商品管理 - PetStore Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" th:href="@{/admin/admin.css}"/>
</head>
<body>
<div id="wrapper">
  <div th:replace="~{admin/fragments/sidebar :: sidebar}" th:with="activePage='product'"></div>
  <div id="page-content-wrapper">
    <div th:replace="~{admin/fragments/topbar :: topbar('商品管理')}"></div>
    <div class="main-content">

      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/index}">仪表盘</a></li>
          <li class="breadcrumb-item active">商品管理</li>
        </ol>
      </nav>

      <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <span><i class="bi bi-box-seam me-2 text-primary"></i>商品列表</span>
            <div class="d-flex gap-2">
              <!-- 按分类筛选 -->
              <form th:action="@{/admin/product/list}" method="get" class="d-flex gap-2">
                <select class="form-select form-select-sm" name="categoryId" style="width:140px">
                  <option value="">全部分类</option>
                  <option th:each="cat : ${categories}"
                          th:value="${cat.categoryId}"
                          th:text="${cat.name}"
                          th:selected="${param.categoryId == cat.categoryId}">Fish</option>
                </select>
                <button type="submit" class="btn btn-sm btn-outline-secondary">
                  <i class="bi bi-funnel"></i> 筛选
                </button>
              </form>
              <a th:href="@{/admin/product/add}" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>新增商品
              </a>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
              <tr>
                <th>商品ID</th>
                <th>商品名称</th>
                <th>所属分类</th>
                <th>描述</th>
                <th style="width:160px">操作</th>
              </tr>
              </thead>
              <tbody>
              <tr th:if="${products == null or #lists.isEmpty(products)}">
                <td colspan="5" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-2 d-block mb-2"></i>暂无商品数据
                </td>
              </tr>
              <tr th:each="product : ${products}">
                <td><code th:text="${product.productId}">FI-SW-01</code></td>
                <td class="fw-semibold" th:text="${product.name}">商品名称</td>
                <td>
                  <span class="badge bg-light text-dark border"
                        th:text="${product.categoryId}">FISH</span>
                </td>
                <td class="text-muted text-truncate" style="max-width:200px"
                    th:text="${product.description}">描述</td>
                <td>
                  <a th:href="@{/admin/product/edit/{id}(id=${product.productId})}"
                     class="btn btn-sm btn-outline-primary me-1">
                    <i class="bi bi-pencil"></i> 编辑
                  </a>
                  <button type="button" class="btn btn-sm btn-outline-danger"
                          th:data-id="${product.productId}"
                          th:data-name="${product.name}"
                          onclick="confirmDelete(this)">
                    <i class="bi bi-trash"></i> 删除
                  </button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h6 class="modal-title fw-bold text-danger"><i class="bi bi-exclamation-triangle me-2"></i>确认删除</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-0">
        <p class="mb-0">确定要删除商品 <strong id="deleteName"></strong> 吗？</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">取消</button>
        <form id="deleteForm" method="post">
          <button type="submit" class="btn btn-sm btn-danger">确认删除</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  const ctx = /*[[@{/admin/product/delete/}]]*/ '/admin/product/delete/';
  function confirmDelete(btn) {
    document.getElementById('deleteName').textContent = btn.dataset.name;
    document.getElementById('deleteForm').action = ctx + btn.dataset.id;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
  }
  document.getElementById('sidebarToggle')?.addEventListener('click', () =>
    document.getElementById('wrapper').classList.toggle('toggled'));
</script>
</body>
</html>
