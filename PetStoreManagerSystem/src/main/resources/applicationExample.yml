server:
  port: 8081

spring:
  application:
    name: PetStoreManagerSystem
  datasource:
    url: jdbc:mysql://localhost:3306
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

admin:
  username: admin
  password: admin123

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.sht.admin.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
